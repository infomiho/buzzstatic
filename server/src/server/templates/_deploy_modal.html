<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<dialog id="deploy-dialog" class="dialog max-w-xl" aria-labelledby="deploy-dialog-title" aria-describedby="deploy-dialog-subtitle">
    <div>
        <header>
            <h2 id="deploy-dialog-title">Deploy a site</h2>
            <p id="deploy-dialog-subtitle">Drop a folder, an HTML file, or a ZIP to deploy.</p>
        </header>
        <section class="flex flex-col gap-4">
            <div id="drop-zone" class="flex flex-col items-center justify-center gap-3 border-2 border-dashed border-ink px-6 py-10 text-center">
                <div>
                    <p class="text-lg font-bold">Drag and drop to deploy</p>
                    <p class="mt-1 text-rule">Folder, <code>index.html</code>, or <code>.zip</code></p>
                </div>
                <div class="mt-2 flex gap-3">
                    <button type="button" class="btn-sm-outline" id="pick-files">Choose file</button>
                    <button type="button" class="btn-sm-outline" id="pick-folder">Choose folder</button>
                </div>
            </div>

            <input type="file" id="file-input" class="hidden" multiple />
            <input type="file" id="folder-input" class="hidden" webkitdirectory directory multiple />

            <div id="staged-selection" class="hidden border-2 border-ink bg-mist px-4 py-3">
                <div class="flex items-center justify-between gap-3">
                    <div class="min-w-0">
                        <p class="truncate font-bold" id="staged-name"></p>
                        <p class="text-sm text-rule" id="staged-detail"></p>
                    </div>
                    <button type="button" class="btn-sm-ghost shrink-0" id="staged-clear">Choose different</button>
                </div>
            </div>

            <div>
                <label for="subdomain-input" class="font-bold">Site name</label>
                <input id="subdomain-input" class="input mt-1" placeholder="auto-generated if blank" autocomplete="off" spellcheck="false" />
                <p id="subdomain-hint" class="mt-1 hidden text-rule">Deploying to this existing site.</p>
            </div>

            <!-- New deploys only. Deploying can make a site private but never
                 public, so an unchecked box on a redeploy would be a lie. -->
            <div id="deploy-visibility" class="choice-list border-2 border-ink px-4 py-3 text-lg">
                <label>
                    <input type="checkbox" id="deploy-private">
                    <span>
                        <span class="font-bold">Make private</span>
                        <span class="block text-rule">Only you will be able to view it.</span>
                    </span>
                </label>
            </div>

            <div id="upload-status" class="hidden"></div>
        </section>
        <footer>
            <button class="btn-outline" id="deploy-dialog-close">Close</button>
            <button class="btn" id="deploy-dialog-submit" disabled>Deploy</button>
        </footer>
    </div>
</dialog>
