# Buzz standalone stack. Replace this file on every update and never edit it:
# server settings live in .env, local changes in compose.override.yml.
# Traefik reads its static configuration from the TRAEFIK_* variables below, so an
# override can add or change single keys. Never give Traefik a command: any
# command-line argument makes it ignore these variables.
# Buzz obtains the certificate for BUZZ_DOMAIN and *.BUZZ_DOMAIN itself and
# publishes it, with custom-domain routers, through the shared dynamic volume.
services:
  traefik:
    image: traefik:v3.7.14
    restart: unless-stopped
    environment:
      TRAEFIK_PROVIDERS_DOCKER: "true"
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_FILE_DIRECTORY: /traefik/dynamic
      TRAEFIK_PROVIDERS_FILE_WATCH: "true"
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO: websecure
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME: https
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_STORAGE: /letsencrypt/acme-http.json
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_HTTPCHALLENGE_ENTRYPOINT: web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
      - traefik-dynamic:/traefik/dynamic

  server:
    image: ghcr.io/infomiho/buzzstatic:0.7.1 # x-release-please-version
    restart: unless-stopped
    env_file: .env
    environment:
      BUZZ_DATA_DIR: /data
      BUZZ_TRAEFIK_DYNAMIC_DIR: /traefik-dynamic
      BUZZ_TRAEFIK_HTTPS_ENTRYPOINT: websecure
      BUZZ_CUSTOM_DOMAIN_ORIGIN_HOST: traefik
      BUZZ_TRAEFIK_CERT_RESOLVER: letsencrypt
      BUZZ_CLOUDFLARE_DNS_API_TOKEN: ${BUZZ_CLOUDFLARE_DNS_API_TOKEN:?Set BUZZ_CLOUDFLARE_DNS_API_TOKEN in .env}
    volumes:
      - buzz-data:/data
      - traefik-dynamic:/traefik-dynamic
    labels:
      - traefik.enable=true
      - traefik.http.routers.buzz.rule=Host(`${BUZZ_DOMAIN:?Set BUZZ_DOMAIN in .env to the bare dashboard hostname, such as buzz.example.com}`)
      - traefik.http.routers.buzz.entrypoints=websecure
      - traefik.http.routers.buzz.tls=true
      - traefik.http.routers.buzz-wildcard.rule=HostRegexp(`.+\.${BUZZ_DOMAIN}`)
      - traefik.http.routers.buzz-wildcard.entrypoints=websecure
      - traefik.http.routers.buzz-wildcard.tls=true
      - traefik.http.services.buzz.loadbalancer.server.port=8080

volumes:
  buzz-data:
    name: buzz_buzz-data
  traefik-certs:
    name: buzz_traefik-certs
  traefik-dynamic:
    name: buzz_traefik-dynamic
