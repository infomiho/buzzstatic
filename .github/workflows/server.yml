name: Server

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ./server
          load: true
          tags: buzz-server:smoke
          cache-from: type=gha,scope=server-linux-amd64
          cache-to: type=gha,mode=max,scope=server-linux-amd64

      - name: Boot the image offline and wait for healthy
        run: |
          docker run -d --name buzz \
            --network none \
            --health-interval 2s \
            -e BUZZ_DOMAIN=buzz.localhost \
            -e GITHUB_CLIENT_ID=dummy \
            -e GITHUB_CLIENT_SECRET=dummy \
            -e BUZZ_DATA_DIR=/data \
            buzz-server:smoke
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' buzz)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker inspect --format '{{json .State}}' buzz
          docker logs buzz
          exit 1

      - name: Upgrade the standalone Compose stack from the latest release
        env:
          BUZZ_FROM_IMAGE: ghcr.io/infomiho/buzzstatic:latest
          BUZZ_TO_IMAGE: buzz-server:smoke
          BUZZ_TEST_OFFLINE: "false"
        run: server/tests/compose/boot-test.sh
